name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app-generada:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconstruir la app desde fuente/
        run: python fuente/build_game.py
      - name: camino-parcial.html debe coincidir con fuente/
        run: git diff --exit-code -- camino-parcial.html
